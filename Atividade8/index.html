<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;
  background-image: url('https://wp-content.amenteemaravilhosa.com.br/2018/02/homem-com-notas.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat; color: white;">
    <div style="background-color: rgba(0, 37, 200, 0.5); padding: 20px; border-radius: 10px;">
   <form onsubmit="salvar(event)" style="display: flex; flex-direction: column; width: 200px; margin: 20px;">
  <label for="nome" style="color: aliceblue;">Nome:</label>
  <input type="text" id="nome" name="nome" required style="border: 1px solid #ccc; padding: 5px; margin-bottom: 10px; border-radius: 5px;">

  <label for="years" style="color: aliceblue;">Idade:</label>
  <input type="number" id="years" name="years" required style="border: 1px solid #ccc; padding: 5px; margin-bottom: 10px; border-radius: 5px;">

  <label for="Sexo" style="color: aliceblue;">Sexo:</label>
  <select id="Sexo" name="Sexo" required style="border: 1px solid #ccc; padding: 5px; margin-bottom: 10px; border-radius: 5px;">
    <option value="masculino">Masculino</option>
    <option value="feminino">Feminino</option>
  </select>

  <label for="opiniao" style="color: aliceblue;">Opinião:</label>
  <select id="opiniao" name="opiniao" style="border: 1px solid #ccc; padding: 5px; margin-bottom: 10px; border-radius: 5px;">
    <option value="Ótimo">Ótimo</option>
    <option value="Bom">Bom</option>
    <option value="Regular">Regular</option>
    <option value="Péssimo">Péssimo</option>
  </select>

    <button type="submit">Enviar</button>
</form>
</div>
<h3 co style="color: aliceblue;">Pessoa mais velha</h3>

<div id="resultado"></div>

<script>
  let maisVelho = null; // guarda os dados da pessoa mais velha até agora

  function salvar(event) {
    event.preventDefault();

    const nome = document.getElementById("nome").value;
    const idade = Number(document.getElementById("years").value);
    const sexo = document.getElementById("Sexo").value;
    const opiniao = document.getElementById("opiniao").value;

    if (maisVelho === null || idade > maisVelho.idade && maisVelho.Sexo !== 'feminino') {
      maisVelho = { nome, idade, sexo, opiniao };
    }

    document.getElementById("resultado").innerHTML =
      `<p>Nome: ${maisVelho.nome}</p>
       <p>Idade: ${maisVelho.idade}</p>
       <p>Sexo: ${maisVelho.sexo}</p>
       <p>Opinião: ${maisVelho.opiniao}</p>`;

    event.target.reset(); // limpa o formulário para o próximo
  }
</script>

</body>
</html>
